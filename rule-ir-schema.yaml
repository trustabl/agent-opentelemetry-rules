  - trustabl.irreversible_unguarded # rules/irreversible_unguarded.yaml
  - trustabl.constraint_hit         # rules/constraint_hit.yaml  (shadow: true)
  - trustabl.false_idempotent       # rules/false_idempotent.yaml
  - trustabl.handoff_unbound        # rules/handoff_unbound.yaml
  - trustabl.instrumentation_degraded # rules/instrumentation_degraded.yaml
