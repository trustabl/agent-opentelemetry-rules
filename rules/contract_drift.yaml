# trustabl.contract_drift
#
# One of Trustabl's v0.1 runtime rules. This file is DATA, not code — it is
# never loaded, parsed, or evaluated by the `trustabl` binary. It is written
# so that a human (or, later, a translator tool) can mechanically turn it
# into a vendor-native alert/monitor: see ../translations/grafana/ for the
# first worked example.
#
# Shape defined in ../rule-ir-schema.yaml. Source: internal strategy memo
# "Process metadata, portable rules, and a policy control plane" (30 Aug
# 2026), §5.5.

id: trustabl.contract_drift
title: Contract SHA changed mid-run
severity: high
fix_class: policy.pin_contract

# The labels spec reserves these two as RESOURCE attributes, set by the
# deployment through OTEL_RESOURCE_ATTRIBUTES (spec/keys.json not_emitted_here:
# "trustabl.contract_id": "deployment, via OTEL_RESOURCE_ATTRIBUTES",
# "trustabl.contract_hash": "deployment, via OTEL_RESOURCE_ATTRIBUTES").
# A resource attribute is fixed for one process, so drift shows up as spans of
# the same run carrying different resource values (for example a run that
# crosses two services), not as one span changing.
when:
  span: execute_tool
  window: same_run_id
  condition:
    value_drift: trustabl.contract_hash
    across: steps_in_run

evidence:
  - trustabl.contract_id
  - trustabl.contract_hash
  - trustabl.run_id
  - trustabl.step_index

shadow: false
