# trustabl.policy_drift
#
# One of Trustabl's v0.1 runtime rules. This file is DATA, not code — it is
# never loaded, parsed, or evaluated by the `trustabl` binary. It is written
# so that a human (or, later, a translator tool) can mechanically turn it
# into a vendor-native alert/monitor: see ../translations/grafana/ for the
# first worked example.
#
# Shape defined in ../rule-ir-schema.yaml. Source: internal strategy memo
# "Process metadata, portable rules, and a policy control plane" (30 Aug
# 2026), §5.5.

id: trustabl.policy_drift
title: Policy binding SHA changed during a run
severity: high
fix_class: policy.pin_bundle

# The SDK emits bindings as trustabl.policy.binding EVENTS on invoke_agent
# spans (spec/keys.json in agent-reliability-otel-labels), not as span
# attributes on execute_tool spans. Two things are still open and need the
# separate event-predicate proposal: reading an event field in a condition,
# and comparing the sha256 per trustabl.policy.binding.id (without that, two
# different bindings in one run would look like drift).
when:
  span: invoke_agent
  window: same_run_id
  condition:
    value_drift: trustabl.policy.binding.sha256
    across: invoke_agent_spans_in_run

evidence:
  - trustabl.policy.binding.id
  - trustabl.policy.binding.sha256
  - trustabl.run_id
  - trustabl.step_index

shadow: false
