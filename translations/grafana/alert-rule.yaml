# Grafana alerting provisioning file for trustabl.tool_loop.
# Hand-authored worked example (see README.md in this directory) — not
# generated by tooling, and not consumed by the `trustabl` binary.
#
# Format: Grafana unified alerting provisioning
# (https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/).
# Drop into Grafana's provisioning/alerting/ directory, or import via the
# alerting API, after filling in a real datasourceUid for your Tempo
# instance.

apiVersion: 1

groups:
  - orgId: 1
    name: trustabl-rules
    folder: Trustabl
    interval: 5m
    rules:
      - uid: trustabl-tool-loop
        title: "trustabl.tool_loop"
        # Maps from rules/tool_loop.yaml: when.span=execute_tool,
        # when.window=last_5_tool_calls_in_run -> 5m range,
        # when.condition.count_same/gte -> the threshold expression below.
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "<TEMPO_DATASOURCE_UID>"
            model:
              refId: A
              queryType: traceql
              query: >-
                count_over_time({ span.gen_ai.operation.name="execute_tool"
                && span.trustabl.tool.input_fp != "" }[5m])
              # NOTE: this TraceQL string is transcribed verbatim from the
              # source memo's §5.6 sketch. It does not itself express
              # when.condition.side_effect_not: none from the rule IR —
              # see README.md's "What this translation does not capture yet"
              # section.
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    # when.condition.gte: 3 in the rule IR
                    params: [3]
        noDataState: NoData
        execErrState: Error
        for: 5m
        # severity/labels below come straight from rules/tool_loop.yaml
        labels:
          rule_id: trustabl.tool_loop
          fix_class: policy.cap_tool
          severity: high
        annotations:
          summary: "Repeated tool call with identical arguments"
          description: >-
            Same trustabl.tool.input_fp seen 3+ times in the last 5 tool
            calls of a run, with a non-"none" side effect. See
            gen_ai.tool.name, trustabl.tool.attempt, and trustabl.step_index
            on the matching spans for evidence.
          maps_to_static: "TOOL_IDEMPOTENCY / LOOP_UNBOUNDED"
